name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Application Syntax & Build
        run: node -c server.js db.js routes/password.js

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to application directory on EC2
            cd ${{ secrets.TARGET_DIR || '~/ci-cd' }}
            
            # Pull latest changes from the main branch
            git pull origin main
            
            # Install production dependencies
            npm install --production
            
            # Restart application with PM2 (or start if not already running)
            pm2 restart express-app || pm2 start server.js --name "express-app"
            
            # Save PM2 process list so it survives server reboots
            pm2 save
